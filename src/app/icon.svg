<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0F17" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Tech Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="16 10" opacity="0.3" />

  <!-- Central Emblem: Monogram 'H' & 'A' Cyber Logo -->
  <g transform="translate(0, 10)">
    <!-- Left Vertical Stem -->
    <rect x="150" y="130" width="36" height="230" rx="6" fill="url(#goldGrad)" />
    
    <!-- Right Vertical Stem -->
    <rect x="326" y="130" width="36" height="230" rx="6" fill="url(#goldGrad)" />
    
    <!-- Center Horizontal Bridge -->
    <rect x="180" y="230" width="152" height="32" rx="4" fill="url(#goldGrad)" />
    
    <!-- Top Apex Pyramid forming 'A' -->
    <polygon points="256,110 320,210 192,210" fill="url(#goldGrad)" />
    
    <!-- Inner Cutout in Apex Pyramid -->
    <polygon points="256,145 290,195 222,195" fill="#09090E" />

    <!-- Center Accent Diamond -->
    <polygon points="256,220 272,246 256,272 240,246" fill="#050508" stroke="url(#goldGrad)" stroke-width="3" />
  </g>
</svg>
